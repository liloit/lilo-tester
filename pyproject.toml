[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lilo-tester"
version = "3.0.3"
description = "Web Automation Testing Suite. One command. One report."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "playwright>=1.45.0",
  "rich>=13.7.0",
  "Pillow>=10.3.0",
  "jinja2>=3.1.3",
  "colorama>=0.4.6",
  "pyyaml>=6.0.2",
]

[project.scripts]
liloit = "lilo_tester:cli"

[tool.setuptools]
py-modules = ["lilo_tester"]
