[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lilo-tester"
version = "5.0.0"
description = "Deep DAST & Advanced Web Security Scanner. One command. Full report."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["dast", "security", "web", "scanner", "pentest", "xss", "sqli", "idor", "playwright"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "playwright>=1.45.0",
  "rich>=13.7.0",
  "Pillow>=10.3.0",
  "jinja2>=3.1.3",
  "aiohttp>=3.9.0",
  "colorama>=0.4.6",
]

[project.optional-dependencies]
oob = [
  "interactsh>=1.0.0",
]

[project.urls]
Repository = "https://github.com/yourusername/lilo-tester"

[project.scripts]
liloit = "lilo_tester:cli"

[tool.setuptools]
py-modules = ["lilo_tester"]
